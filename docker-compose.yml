version: "2.4"
services:
  vroom:
    # network_mode: host
    ports:
      - 3001:3000
    image: vroomvrp/vroom-docker:v1.13.0
    container_name: vroom
    volumes:
      - ./vroom-conf/:/conf
    environment:
      - VROOM_ROUTER=ors  # router to use, osrm or ors
    depends_on:
      - ors
  # EXAMPLE for OpenRouteService, please consult the repo for details
  ors:
    container_name: ors
    ports:
      - 8081:8082
    image: openrouteservice/openrouteservice:v9.10.0
    volumes:
      - ./graphs:/home/ors/graphs
      - ./elevation_cache:/home/ors/elevation_cache
      - ./maps/illinois-latest.osm.pbf:/home/ors/files/osm_file.pbf
      - ./conf/ors-config.yml:/home/ors/config/ors-config.yml
    environment:
      - BUILD_GRAPHS=false
      - "JAVA_OPTS=-Djava.awt.headless=true -server -XX:TargetSurvivorRatio=75 -XX:SurvivorRatio=64 -XX:MaxTenuringThreshold=3 -XX:+UseG1GC -XX:ParallelGCThreads=4 -Xms1g -Xmx2g"
  # EXAMPLE for OpenRouteService, please consult the repo for details
  # osrm:
  #   image: osrm/osrm-backend
  #   container_name: osrm
  #   restart: always
  #   ports:
  #     - 5000:5000
  #   volumes:
  #     - ./osrm:/data
  #   command: "osrm-routed --max-matching-size 1000 --max-table-size 1000 --max-viaroute-size 1000 --algorithm mld /data/map.osrm"
